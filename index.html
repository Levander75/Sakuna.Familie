<script>
        // --- MUSIC PLAYER LOGIK ---
        const playlist = [
            { title: "Jim Beam & Voddi", src: "Jim Beam & Voddi - AK AUSSERKONTROLLE (128k).mp3" },
            { title: "LUCIANO x JAZEEK - Starboy", src: "LUCIANO x JAZEEK - Starboy [Official Video] - Luciano Locosquad (128k).mp3" },
            { title: "LACAZETTE H&K", src: "LACAZETTE - H&K - LACAZETTE (128k).mp3" }, // <-- Hier war vorher kein Komma!
            { title: "Ghost61 - Mgm", src: "Mgm - Ghost61 - Topic (128k).mp3" }
        ];
        
        let currentTrackIndex = 0;
        const audio = new Audio();
        
        const songTitleEl = document.getElementById('songTitle');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const volumeSlider = document.getElementById('volumeSlider');

        function loadTrack(index) {
            audio.src = playlist[index].src;
            songTitleEl.textContent = playlist[index].title;
            audio.volume = volumeSlider.value;
            audio.load();
        }

        function playTrack() {
            audio.play().then(() => {
                playPauseBtn.innerHTML = '&#10074;&#10074;';
            }).catch(e => {
                console.log("Autoplay blockiert oder Datei nicht gefunden:", e);
                playPauseBtn.innerHTML = '&#9658;';
            });
        }

        function pauseTrack() {
            audio.pause();
            playPauseBtn.innerHTML = '&#9658;';
        }

        playPauseBtn.addEventListener('click', () => {
            if (audio.paused) {
                if(!audio.src) {
                    loadTrack(currentTrackIndex);
                }
                playTrack();
            } else {
                pauseTrack();
            }
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        volumeSlider.addEventListener('input', (e) => {
            audio.volume = e.target.value;
        });

        audio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            playTrack();
        });

        loadTrack(currentTrackIndex);

        // --- DISCORD KOPIEREN ---
        const discordLink = "https://discord.gg/WySr2ZGku";

        function copyDiscordLink() {
            navigator.clipboard.writeText(discordLink).then(() => {
                const toast = document.getElementById('copyToast');
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2500);
            }).catch(err => {
                console.error('Fehler beim Kopieren: ', err);
            });
        }
    </script>
